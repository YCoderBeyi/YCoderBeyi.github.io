<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TırıVırı Puantaj</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; color: #17352b; background: #f5faf7; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(640px, calc(100% - 48px)); padding: 48px 0; }
      .card { background: #fff; border: 1px solid #dce9e2; border-radius: 24px; padding: 40px; box-shadow: 0 16px 40px #17352b14; }
      .badge { display: inline-block; background: #dff6e8; color: #157347; font-weight: 700; padding: 6px 11px; border-radius: 999px; font-size: .82rem; }
      h1 { font-size: clamp(2rem, 8vw, 3rem); letter-spacing: -.05em; margin: 18px 0 12px; }
      p { color: #53655d; line-height: 1.65; }
      a { display: inline-block; margin-top: 16px; color: #0b6b45; font-weight: 700; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <span class="badge">DEREBASI STUDIO</span>
        <h1>TırıVırı Puantaj</h1>
        <p>Çalışan, proje, puantaj ve ödeme takibini pratik biçimde yönetmek için tasarlanmış mobil uygulama.</p>
        <a href="privacy.html">Gizlilik Politikası →</a>
      </section>
    </main>
  </body>
</html>
